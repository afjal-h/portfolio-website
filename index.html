<head>
  <meta charset="utf-8" />

  <title>Wii Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Mobile: Standard cursor behavior */
    * {
      cursor: auto;
    }

    /* Desktop: Hide system cursor to use custom Wii pointer */
    @media (min-width: 1024px) {
      * {
        cursor: none !important;
      }
    }

    body {
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      background-color: #0b0b0b;
      margin: 0;
      /* Use dvh for better mobile address bar handling */
      height: 100dvh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Base Container Styles - Mobile Optimized */
    #crt-warp-container {
      position: relative;
      width: 100vw;
      height: 100dvh;
      background-color: #f3f4f6;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transform: none;
    }



    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 4px;
    }

    .wii-shadow {
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), inset 0 2px 4px 0 rgba(255, 255, 255, 0.6);
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    .animate-float {
      animation: float 4s ease-in-out infinite;
      will-change: transform;
    }

    /* CRT Scanlines Effect */
    .crt-scanlines::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 2;
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
    }



    /* CRT Color Separation Effect */
    .crt-colorsep {
      animation: textShadow 1.6s infinite;
    }

    @keyframes textShadow {
      0% {
        text-shadow: 0.4389924193300864px 0 1px rgba(0, 30, 255, 0.5), -0.4389924193300864px 0 1px rgba(255, 0, 80, 0.3), 0 0 3px;
